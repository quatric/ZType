name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the release on a v* tag

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates
      - name: Build
        run: make
      - name: Package for Homebrew Channel
        run: |
          mkdir -p dist/apps/typeshot
          cp zType-wii-xz.dol dist/apps/typeshot/boot.dol
          cp apps/typeshot/meta.xml dist/apps/typeshot/
          cp apps/typeshot/icon.png dist/apps/typeshot/
      - uses: actions/upload-artifact@v4
        with:
          name: typeshot-wii
          path: dist/
      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
          (cd dist && zip -r "$GITHUB_WORKSPACE/typeshot-wii.zip" apps)
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: typeshot-wii.zip
